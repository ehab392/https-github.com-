<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | حجة بتول</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo-c">
        <a href="/"><img src="/images/logo.png" alt="حجة بتول"></a>
        <h1>حجة بتول</h1>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="active" data-tab="login">تسجيل الدخول</button>
        <button type="button" role="tab" data-tab="register">حساب جديد</button>
      </div>

      <form id="loginForm" novalidate>
        <div class="field"><label for="lEmail">البريد الإلكتروني</label>
          <input id="lEmail" type="email" autocomplete="email" required dir="ltr" style="text-align:right"></div>
        <div class="field"><label for="lPass">كلمة المرور</label>
          <input id="lPass" type="password" autocomplete="current-password" required></div>
        <p class="form-error" id="lErr" role="alert"></p>
        <button class="btn btn-block" type="submit">دخول</button>
      </form>

      <form id="regForm" novalidate hidden>
        <div class="field"><label for="rName">اسم المستخدم</label>
          <input id="rName" autocomplete="name" required></div>
        <div class="field"><label for="rPhone">رقم الهاتف</label>
          <input id="rPhone" type="tel" inputmode="tel" autocomplete="tel" required dir="ltr" style="text-align:right"></div>
        <div class="field"><label for="rEmail">البريد الإلكتروني</label>
          <input id="rEmail" type="email" autocomplete="email" required dir="ltr" style="text-align:right"></div>
        <div class="field"><label for="rPass">كلمة المرور (8 أحرف على الأقل)</label>
          <input id="rPass" type="password" autocomplete="new-password" minlength="8" required></div>
        <p class="form-error" id="rErr" role="alert"></p>
        <button class="btn btn-block" type="submit">إنشاء الحساب</button>
      </form>

      <p style="text-align:center;margin:1rem 0 0"><a href="/">العودة إلى المتجر</a></p>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
